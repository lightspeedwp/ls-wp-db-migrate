name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js && npm run lint:md

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: shellcheck --severity=error scripts/*.sh

      - name: Check JSON files
        run: |
          for file in *.json .claude/*.json; do
            if [ -f "$file" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))" && echo "✓ $file" || { echo "✗ $file"; exit 1; }
            fi
          done

      - name: Check YAML files
        run: |
          if command -v yamllint &> /dev/null; then
            yamllint .github/labeler.yml || true
          fi
