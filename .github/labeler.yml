# GitHub Labeler Configuration
# Automatically apply labels based on changed files

# Code changes
"code":
  - scripts/**/*.sh
  - api/**
  - plugin/**

# Tests
"tests":
  - __tests__/**
  - tests/**
  - "*.test.js"
  - "*.bats"

# Documentation
"documentation":
  - docs/**
  - README.md
  - "*.md"

# Configuration
"configuration":
  - .claude/**
  - .github/**
  - package.json
  - jest.config.js
  - ".claude/**"

# Dependencies
"dependencies":
  - package.json
  - package-lock.json

# Skill & Plugin
"skill":
  - SKILL.md
  - skills/**
  - docs/IMPROVEMENTS.md
  - prompts/**
  - scripts/**

"plugin":
  - plugin/**
  - manifest.json

# Types of changes
"type: feature":
  - scripts/**
  - api/**

"type: bug":
  - scripts/**
  - api/**

"type: enhancement":
  - docs/**
  - docs/IMPROVEMENTS.md

"type: documentation":
  - "**/*.md"
  - docs/**

"type: testing":
  - __tests__/**
  - tests/**

# Areas
"area: migration":
  - scripts/migrate-*.sh
  - scripts/lib-studio.sh

"area: validation":
  - scripts/verify-*.sh
  - scripts/preflight-*.sh

"area: cli":
  - scripts/**/*.sh

"area: studio":
  - docs/STUDIO-CLI-GUIDE.md
  - scripts/studio-*.sh
